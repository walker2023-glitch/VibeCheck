openapi: 3.1.0
info:
  title: VibeCheck proposed application API
  version: 0.2.0-proposal
  description: >-
    M0-02A contract only; no routes exist. MASTER_SPEC.md governs conflicts.
    Browser requests use HTTP-only same-site session cookies. Guest cookies authorize
    only short-lived public resources. All bodies use {data,error}. Source code,
    credentials, answer keys, rubrics, and hidden model reasoning are never public fields.
    Operations tagged x-stage: product-stage-1-after-demo are not Hackathon Demo targets.
servers:
  - url: /api/v1
tags:
  - name: repositories
  - name: analysis
  - name: learning
  - name: later-stage
paths:
  /repositories:
    post:
      tags: [repositories]
      summary: Register a bounded public repository or an authorized private repository
      description: >-
        Guests may submit public GitHub URLs only. A successful guest request establishes
        a short-lived HTTP-only guest cookie. Private URLs require an authenticated
        per-repository grant; no GitHub credential reaches JavaScript. Never reveal
        whether an unauthorized private repository exists.
      security: []
      x-idempotency: required
      x-rate-limit-policy: strict-guest-or-user-import
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [githubUrl]
              properties:
                githubUrl: { type: string, format: uri }
      responses:
        '201': { $ref: '#/components/responses/RepositoryCreated' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      tags: [repositories]
      summary: List persisted repositories for the signed-in user
      x-stage: product-stage-1-after-demo
      security: [{ userSession: [] }]
      x-rate-limit-policy: standard-user-read
      parameters: [{ $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: Cursor page of owned repositories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryPageEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /repositories/{repositoryId}/ai-consent:
    put:
      tags: [repositories]
      summary: Set or revoke consent for sending bounded source to managed AI
      description: Guest consent is session-scoped; user consent is repository-scoped. Revocation stops future transfers.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: standard-write
      parameters: [{ $ref: '#/components/parameters/RepositoryId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [granted, consentVersion]
              properties:
                granted: { type: boolean }
                consentVersion: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Consent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /repositories/{repositoryId}:
    get:
      tags: [repositories]
      summary: Recover an owned repository and its latest analysis run ID
      description: Guests may recover only their short-lived public repository in the same valid guest session. Authenticated users may recover only their own repository. Foreign IDs return RESOURCE_NOT_FOUND; no run-history listing is implied.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: standard-read
      parameters: [{ $ref: '#/components/parameters/RepositoryId' }]
      responses:
        '200': { $ref: '#/components/responses/RepositoryFound' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [repositories]
      summary: Request deletion of an owned repository and its derived analysis
      x-stage: product-stage-1-after-demo
      description: Idempotent request. Knowledge derived from other remaining attempts is recomputed. Physical completion follows the later approved retention/deletion policy.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: standard-write
      parameters: [{ $ref: '#/components/parameters/RepositoryId' }]
      responses:
        '202': { $ref: '#/components/responses/Acknowledged' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /repositories/{repositoryId}/analysis-runs:
    post:
      tags: [analysis]
      summary: Start a bounded analysis of real repository code
      description: At most the configured commit range and file sizes; duplicate active snapshot work is coalesced. No code is executed.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-idempotency: required
      x-rate-limit-policy: strict-guest-or-user-analysis
      parameters: [{ $ref: '#/components/parameters/RepositoryId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fromCommit: { type: string, description: Optional commit SHA; bounded server-side }
                toCommit: { type: string, description: Optional commit SHA; defaults to resolved HEAD }
      responses:
        '202': { $ref: '#/components/responses/AnalysisAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /analysis-runs/{runId}:
    get:
      tags: [analysis]
      summary: Poll analysis stage, progress, and safe terminal error
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: bounded-poll
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200': { $ref: '#/components/responses/AnalysisStatus' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /analysis-runs/{runId}/cancel:
    post:
      tags: [analysis]
      summary: Request cancellation between analysis stages
      x-stage: product-stage-1-after-demo
      security: [{ userSession: [] }, { guestSession: [] }]
      x-idempotency: required
      x-rate-limit-policy: standard-write
      parameters: [{ $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/AnalysisAccepted' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /analysis-runs/{runId}/concepts:
    get:
      tags: [analysis]
      summary: List concepts with evidence pinned to this immutable analysis run
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: standard-read
      parameters: [{ $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/ConceptPage' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /analysis-runs/{runId}/files/{fileId}/excerpt:
    get:
      tags: [analysis]
      summary: Read a bounded source excerpt for a cited file
      x-stage: product-stage-1-after-demo
      description: Deferred until a file-discovery projection exists. The demo uses bounded redacted Evidence.snippet instead.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: bounded-source-read
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/FileId' }
        - { name: startLine, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: endLine, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Excerpt' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /code-detective:
    post:
      tags: [learning]
      summary: Explain selected code with observed or inferred claims
      security: [{ userSession: [] }, { guestSession: [] }]
      x-idempotency: optional
      x-rate-limit-policy: strict-guest-or-user-ai
      description: A retry may regenerate an explanation; owner-scoped caching and rate limits may deduplicate it. No durable knowledge record is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId, evidenceId]
              properties:
                runId: { type: string }
                evidenceId: { type: string }
                audience: { type: string, enum: [beginner, advanced] }
      responses:
        '200': { $ref: '#/components/responses/Explanation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /assessments:
    post:
      tags: [learning]
      summary: Generate a short assessment grounded in analysis evidence
      description: The Hackathon Demo generates multiple-choice items only. A repeated request may create another session-scoped assessment; answers and attempts remain assessment-scoped. Written items are later Product Stage 1 work.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-idempotency: optional
      x-rate-limit-policy: strict-guest-or-user-ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId, conceptIds]
              properties:
                runId: { type: string }
                conceptIds: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
      responses:
        '201': { $ref: '#/components/responses/Assessment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /assessments/{assessmentId}:
    get:
      tags: [learning]
      summary: Fetch questions without keys, rubrics, or withheld explanations
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: standard-read
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      responses:
        '200': { $ref: '#/components/responses/Assessment' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /assessments/{assessmentId}/attempts:
    post:
      tags: [learning]
      summary: Submit an answer and receive educational feedback
      description: Prefer not to say retains practice evidence but updates neither demonstrated track. Guests never receive a persistent knowledge profile.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-idempotency: required
      x-rate-limit-policy: strict-guest-or-user-attempt
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [itemId, answer, aiAssistance]
              properties:
                itemId: { type: string }
                answer: { type: string, maxLength: 4000, description: Demo uses a choice ID; bounded written answer is a later Stage 1 extension }
                aiAssistance: { type: string, enum: [yes, 'no', prefer_not_to_say] }
      responses:
        '201': { $ref: '#/components/responses/Attempt' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /assessments/{assessmentId}/completion:
    get:
      tags: [learning]
      summary: Derive a session-scoped completion and skill result from valid graded attempts
      description: Guest results expire with the guest session and never create a persistent My Skills profile. Correct deterministic answers are demonstrated for the declared track; incorrect or practice-only concepts remain unverified. An incomplete assessment returns completed false.
      security: [{ userSession: [] }, { guestSession: [] }]
      x-rate-limit-policy: standard-read
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      responses:
        '200': { $ref: '#/components/responses/Completion' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /my-skills:
    get:
      tags: [learning]
      summary: Read persistent independent and assisted states separately from unverified concepts
      x-stage: product-stage-1-after-demo
      security: [{ userSession: [] }]
      x-rate-limit-policy: standard-user-read
      parameters: [{ $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/SkillPage' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /assessment-items/{itemId}/reports:
    post:
      tags: [later-stage]
      summary: Report a questionable item for review
      x-stage: product-stage-1-after-demo
      security: [{ userSession: [] }, { guestSession: [] }]
      x-idempotency: required
      x-rate-limit-policy: standard-write
      parameters: [{ $ref: '#/components/parameters/ItemId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '202': { $ref: '#/components/responses/Acknowledged' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /companion/messages:
    post:
      tags: [later-stage]
      summary: Generate a grounded companion message from bounded page context
      x-stage: product-stage-1-after-demo
      security: [{ userSession: [] }, { guestSession: [] }]
      x-idempotency: required
      x-rate-limit-policy: strict-guest-or-user-ai
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [page, question]
              properties:
                page: { type: string }
                runId: { type: string }
                evidenceId: { type: string }
                question: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/Explanation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    userSession: { type: apiKey, in: cookie, name: vibecheck_session, description: HTTP-only SameSite=Lax authenticated session }
    guestSession: { type: apiKey, in: cookie, name: vibecheck_guest, description: HTTP-only short-lived public-only scope }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
    RepositoryId: { name: repositoryId, in: path, required: true, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string } }
    FileId: { name: fileId, in: path, required: true, schema: { type: string } }
    AssessmentId: { name: assessmentId, in: path, required: true, schema: { type: string } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string } }
  schemas:
    RepositoryPageEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Repository' } }
            nextCursor: { type: [string, 'null'] }
        error: { type: 'null' }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code: { type: string, description: Stable code from errors.md }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
    Evidence:
      type: object
      additionalProperties: false
      required: [id, commitSha, path, startLine, endLine, language, kind, snippet, snippetTruncated]
      properties:
        id: { type: string }
        commitSha: { type: string }
        path: { type: string }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        language: { type: string }
        kind: { type: string, enum: [observed, inferred] }
        snippet: { type: string, maxLength: 2000, description: Bounded source text for this citation; secrets redacted server-side; never a whole-file projection }
        snippetTruncated: { type: boolean, description: True when source text for the cited range exceeded the snippet cap }
    Claim:
      type: object
      additionalProperties: false
      required: [kind, text, evidenceRefs]
      properties:
        kind: { type: string, enum: [observed, inferred] }
        text: { type: string }
        evidenceRefs: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
      description: Observed claims require one or more validated evidence refs; enforced beyond JSON Schema.
    Repository:
      type: object
      additionalProperties: false
      required: [id, githubUrl, visibility, persistence, latestRunId]
      properties:
        id: { type: string }
        githubUrl: { type: string, format: uri }
        visibility: { type: string, enum: [public, private] }
        persistence: { type: string, enum: [ephemeral, account] }
        latestRunId: { type: [string, 'null'], description: Latest run scoped to this repository and caller; null before analysis }
    AnalysisRun:
      type: object
      additionalProperties: false
      required: [id, repositoryId, status, stage, snapshotSha]
      properties:
        id: { type: string }
        repositoryId: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        stage: { type: string, enum: [queued, fetching, detecting, clarifying, persisting, complete] }
        snapshotSha: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        partial: { type: boolean }
        skippedFiles: { type: integer, minimum: 0 }
        errorCode: { type: [string, 'null'] }
    Concept:
      type: object
      additionalProperties: false
      required: [id, label, evidence]
      properties:
        id: { type: string }
        label: { type: string }
        evidence: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Evidence' } }
    AssessmentItem:
      type: object
      additionalProperties: false
      required: [id, conceptId, type, question, evidence]
      description: The demo returns multiple_choice only; written is a later Product Stage 1 extension.
      properties:
        id: { type: string }
        conceptId: { type: string }
        type: { type: string, enum: [multiple_choice, written] }
        question: { type: string }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
        evidence: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Evidence' } }
    Assessment:
      type: object
      additionalProperties: false
      required: [id, runId, items]
      properties:
        id: { type: string }
        runId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/AssessmentItem' } }
    Attempt:
      type: object
      additionalProperties: false
      required: [id, itemId, outcome, aiAssistance, practiceOnly, feedback, gradingLabel]
      properties:
        id: { type: string }
        itemId: { type: string }
        outcome: { type: string, enum: [correct, partial, incorrect] }
        aiAssistance: { type: string, enum: [yes, 'no', prefer_not_to_say] }
        practiceOnly: { type: boolean }
        gradingLabel: { type: string, enum: [Deterministically graded, 'AI-graded, reviewable'] }
        feedback: { type: string }
        misconception: { type: [string, 'null'] }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        followUpQuestion: { type: string }
    SessionConceptResult:
      type: object
      additionalProperties: false
      required: [conceptId, status, independentOutcome, assistedOutcome, practiceOnly, evidence]
      properties:
        conceptId: { type: string }
        status: { type: string, enum: [demonstrated, unverified], description: Demonstrated only when a valid graded Yes/No attempt is correct }
        independentOutcome: { type: [string, 'null'], enum: [correct, incorrect, null], description: Latest valid graded No attempt in this assessment session }
        assistedOutcome: { type: [string, 'null'], enum: [correct, incorrect, null], description: Latest valid graded Yes attempt in this assessment session }
        practiceOnly: { type: boolean, description: At least one Prefer not to say attempt; never establishes demonstrated knowledge }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
    SessionCompletion:
      type: object
      additionalProperties: false
      required: [assessmentId, completed, itemCount, attemptedItemCount, concepts]
      properties:
        assessmentId: { type: string }
        completed: { type: boolean, description: True when each available item has a valid graded attempt in this session }
        itemCount: { type: integer, minimum: 0 }
        attemptedItemCount: { type: integer, minimum: 0 }
        concepts: { type: array, items: { $ref: '#/components/schemas/SessionConceptResult' } }
        expiresAt: { type: [string, 'null'], format: date-time, description: Guest session expiry; null for authenticated session }
    Skill:
      type: object
      additionalProperties: false
      required: [conceptId, independentState, assistedState, observedUnverified]
      properties:
        conceptId: { type: string }
        independentState: { $ref: '#/components/schemas/KnowledgeState' }
        assistedState: { $ref: '#/components/schemas/KnowledgeState' }
        observedUnverified: { type: boolean }
        stale: { type: boolean }
    KnowledgeState: { type: string, enum: [unassessed, assessed_correct, assessed_partial, assessed_incorrect] }
  responses:
    Error:
      description: Safe domain error; consult errors.md for code/status/retryability
      headers:
        Retry-After: { description: Present for timed retryable limits, schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error]
            properties:
              data: { type: 'null' }
              error: { $ref: '#/components/schemas/Error' }
    RepositoryCreated:
      description: Repository registered
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { $ref: '#/components/schemas/Repository' }, error: { type: 'null' } } }
    RepositoryFound:
      description: Owned repository with latestRunId for refresh/navigation recovery
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { $ref: '#/components/schemas/Repository' }, error: { type: 'null' } } }
    AnalysisAccepted:
      description: Queued or cancellation requested
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { $ref: '#/components/schemas/AnalysisRun' }, error: { type: 'null' } } }
    AnalysisStatus:
      description: Owned run status, including terminal status
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { $ref: '#/components/schemas/AnalysisRun' }, error: { type: 'null' } } }
    Consent:
      description: Consent status, no provider credentials
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { type: object, required: [granted, consentVersion], properties: { granted: { type: boolean }, consentVersion: { type: string } } }, error: { type: 'null' } } }
    ConceptPage:
      description: Paged concepts and source evidence
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Concept' } }, nextCursor: { type: [string, 'null'] } } }, error: { type: 'null' } } }
    Excerpt:
      description: Bounded text from the immutable analyzed snapshot
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { type: object, required: [evidence, text], properties: { evidence: { $ref: '#/components/schemas/Evidence' }, text: { type: string } } }, error: { type: 'null' } } }
    Explanation:
      description: Grounded explanation; no hidden model reasoning
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { type: object, required: [summary, claims], properties: { summary: { type: string }, claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }, alternative: { type: string } } }, error: { type: 'null' } } }
    Assessment:
      description: Assessment with no key, rubric, or withheld explanation
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { $ref: '#/components/schemas/Assessment' }, error: { type: 'null' } } }
    Attempt:
      description: Graded attempt with feedback
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { $ref: '#/components/schemas/Attempt' }, error: { type: 'null' } } }
    Completion:
      description: Assessment-session summary derived from graded attempts; guest result is ephemeral
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { $ref: '#/components/schemas/SessionCompletion' }, error: { type: 'null' } } }
    SkillPage:
      description: Persistent skill page for authenticated owner
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Skill' } }, nextCursor: { type: [string, 'null'] } } }, error: { type: 'null' } } }
    Acknowledged:
      description: Report received
      content:
        application/json:
          schema: { type: object, required: [data, error], properties: { data: { type: object, required: [accepted], properties: { accepted: { type: boolean } } }, error: { type: 'null' } } }
