services:
  vibecheck:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USE_FIXTURES: "false"
        NEXT_PUBLIC_API_BASE: /api/v1
    image: vibecheck:homelab
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_CONCEPT: ${AI_MODEL_CONCEPT:-}
    ports:
      - "${VIBECHECK_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
